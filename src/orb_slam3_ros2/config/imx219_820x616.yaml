%YAML:1.0
# ORB-SLAM3 설정 — CSI IMX219, 820x616 (단안)
#
# 내부 파라미터 출처: Pi 의
#   ~/.ros/camera_info/imx219__base_soc_i2c0mux_i2c_1_imx219_10_820x616.yaml
# (2026-09-15 캘리브레이션, --zero-tangent-dist 로 p1 = p2 = 0).
# 카메라를 다시 캘리브레이션하면 아래 Camera1.* 를 그 값으로 바꿔야 한다.
#
# Atlas 저장/불러오기(System.SaveAtlasToFile / LoadAtlasFromFile)는 여기 적지 않는다.
# mono_node 가 atlas_path / mode 파라미터를 보고 실행 시 덧붙인다.

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 647.40490849697915
Camera1.fy: 644.49658237585129
Camera1.cx: 414.60747227042344
Camera1.cy: 267.52136879260513

Camera1.k1: 0.1641922169351254
Camera1.k2: -0.2566519292568234
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 820
Camera.height: 616

# Pi 의 sensors.launch.py slam:=orbslam3 가 15 Hz 로 보낸다.
Camera.fps: 15

# mono_node 는 회색조(mono8)로 넘기므로 이 값은 쓰이지 않는다.
Camera.RGB: 1

# ── ORB 추출기 ────────────────────────────────────────────────────
# EuRoC(752x480) 의 1000 개를 화소 수 비율로 늘렸다 (820x616 은 약 1.4 배).
ORBextractor.nFeatures: 1400
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
# 실내 흰 벽처럼 대비가 낮아 특징점이 부족하면 두 값을 낮춘다 (예: 12 / 5).
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# ── Pangolin 뷰어 (mono_node use_viewer:=true 일 때만) ─────────────
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
